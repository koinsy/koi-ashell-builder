name: Build official a-Shell mini unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Check out pinned official a-Shell source
        uses: actions/checkout@v4
        with:
          repository: holzschu/a-shell
          # Last official source revision before an unreleased browser framework
          # became a required local Xcode reference.
          ref: 134e8799543bfd97699f7bbbdbe0ca5ddc366d75
          path: a-shell
          fetch-depth: 1
          submodules: false

      - name: Initialize official submodules
        shell: bash
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
          # The mini target consumes the two top-level source submodules. CPython's
          # nested package-building repositories are not build inputs here, and one
          # currently references an upstream commit that is no longer fetchable.
          git -C a-shell submodule update --init SwiftTerm cpython

      - name: Download documented xcFramework dependencies
        shell: bash
        run: |
          cd a-shell
          swift package --package-path xcfs resolve

          curl -fsSL -o pythonInstall.tar.gz \
            https://github.com/holzschu/a-shell/releases/download/cpython_05_22/pythonInstall.tar.gz
          tar xzf pythonInstall.tar.gz

          mkdir -p cpython/Python-aux "$RUNNER_TEMP/python-aux"
          for framework in freetype harfbuzz libpng; do
            curl -fsSL -o "$RUNNER_TEMP/python-aux/$framework.zip" \
              "https://github.com/holzschu/Python-aux/releases/download/1.0/$framework.xcframework.zip"
            unzip -q -o "$RUNNER_TEMP/python-aux/$framework.zip" -d cpython/Python-aux
            test -d "cpython/Python-aux/$framework.xcframework"
          done

      - name: Build verified a-Shell-mini target without signing
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ashell-products"
          xcodebuild \
            -project a-shell/a-Shell.xcodeproj \
            -target a-Shell-mini \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$RUNNER_TEMP/ashell-products" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        shell: bash
        run: |
          APP=$(find "$RUNNER_TEMP/ashell-products" -type d -name 'a-Shell-mini.app' -print -quit)
          test -n "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$APP" "$RUNNER_TEMP/ipa/Payload/a-Shell-mini.app"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/a-Shell-mini-unsigned.ipa" Payload

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: a-Shell-mini-official-unsigned
          path: a-Shell-mini-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
