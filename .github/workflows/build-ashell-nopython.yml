name: Build official a-Shell noPython unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Check out pinned official a-Shell source
        uses: actions/checkout@v4
        with:
          repository: holzschu/a-shell
          # Closest official revision containing the noPython target's jsc.swift.
          # Its Xcode project is identical to the previous pinned revision.
          ref: 128c4051c239b1bd2f155bd34ea606c0bc7211f1
          path: a-shell
          fetch-depth: 1
          submodules: false

      - name: Initialize official submodules
        shell: bash
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
          # Initialize every top-level submodule at this pinned revision. Avoid
          # CPython's nested package-building repositories, which are not inputs to
          # the prebuilt mini target.
          git -C a-shell submodule update --init

      - name: Prepare official noPython target
        shell: bash
        run: |
          cd a-shell
          python3 - <<'PY'
          import hashlib
          import plistlib
          import re
          from pathlib import Path

          project_path = Path("a-Shell.xcodeproj/project.pbxproj")
          project_digest = hashlib.sha256(project_path.read_bytes()).hexdigest()
          expected_digest = "051d6a0de975a15e4b127cabd5032ca0ae5be3c540bf7c069b77847b1b968b51"
          if project_digest != expected_digest:
              raise SystemExit("Official noPython project changed from audited revision")
          project = project_path.read_text()
          phase_id = "224A90682ADD0999006DB9CC"
          phase = re.search(
              rf"(?ms)^\s*{phase_id} /\* Embed Frameworks \*/ = \{{(.*?)^\s*\}};",
              project,
          )
          if not phase:
              raise SystemExit("Official noPython embed phase changed")
          body = phase.group(1)
          optional = {
              "pico": "224A91682ADD0999006DB9CC",
              "multimarkdown": "224A91692ADD0999006DB9CC",
          }
          for command, build_id in optional.items():
              line = re.compile(
                  rf"(?m)^\s*{build_id} /\* {command}\.framework in Embed Frameworks \*/,\n"
              )
              body, count = line.subn("", body)
              if count != 1:
                  raise SystemExit(f"Expected one noPython embed entry for {command}; found {count}")
          project = project[:phase.start(1)] + body + project[phase.end(1):]

          # The official full and mini targets link the same Vapor package used
          # by AppDelegate and SceneDelegate. The noPython target omits that
          # linkage, even though it compiles those source files. Add only the
          # missing product dependency and Frameworks entry.
          vapor_build = "A5E110000000000000000001"
          vapor_product = "A5E110000000000000000002"
          vapor_package = "2213DCC12BDFEF8F008BD5F2"
          if any(item in project for item in (vapor_build, vapor_product)):
              raise SystemExit("Reserved noPython Vapor project ID already exists")
          if f'{vapor_package} /* XCRemoteSwiftPackageReference "vapor" */' not in project:
              raise SystemExit("Official Vapor package reference is missing")
          def replace_once(old, new):
              global project
              if project.count(old) != 1:
                  raise SystemExit(f"Expected one project anchor: {old[:80]}")
              project = project.replace(old, new, 1)

          replace_once(
              "/* End PBXBuildFile section */",
              f"\t\t{vapor_build} /* Vapor in Frameworks */ = "
              f"{{isa = PBXBuildFile; productRef = {vapor_product} /* Vapor */; }};\n"
              "/* End PBXBuildFile section */",
          )
          replace_once(
              "/* End XCSwiftPackageProductDependency section */",
              f"\t\t{vapor_product} /* Vapor */ = {{\n"
              "\t\t\tisa = XCSwiftPackageProductDependency;\n"
              f"\t\t\tpackage = {vapor_package} /* XCRemoteSwiftPackageReference \"vapor\" */;\n"
              "\t\t\tproductName = Vapor;\n"
              "\t\t};\n"
              "/* End XCSwiftPackageProductDependency section */",
          )
          replace_once(
              "224A904C2ADD0999006DB9CC /* Frameworks */ = {\n"
              "\t\t\tisa = PBXFrameworksBuildPhase;\n"
              "\t\t\tbuildActionMask = 2147483647;\n"
              "\t\t\tfiles = (\n"
              "\t\t\t\t224A904D2ADD0999006DB9CC /* ios_system.xcframework in Frameworks */,",
              "224A904C2ADD0999006DB9CC /* Frameworks */ = {\n"
              "\t\t\tisa = PBXFrameworksBuildPhase;\n"
              "\t\t\tbuildActionMask = 2147483647;\n"
              "\t\t\tfiles = (\n"
              "\t\t\t\t224A904D2ADD0999006DB9CC /* ios_system.xcframework in Frameworks */,\n"
              f"\t\t\t\t{vapor_build} /* Vapor in Frameworks */,",
          )
          target = re.search(
              r"(?ms)^\s*224A90352ADD0999006DB9CC /\* a-Shell-noPython \*/ = "
              r"\{(.*?)^\s*\};", project,
          )
          if not target or "packageProductDependencies = (\n\t\t\t);" not in target.group(1):
              raise SystemExit("Official noPython package dependency list changed")
          target_body = target.group(1).replace(
              "packageProductDependencies = (\n\t\t\t);",
              f"packageProductDependencies = (\n\t\t\t\t{vapor_product} /* Vapor */,\n\t\t\t);",
              1,
          )
          project = project[:target.start(1)] + target_body + project[target.end(1):]
          project_path.write_text(project)

          dictionary_path = Path("Resources_mini/commandDictionary.plist")
          with dictionary_path.open("rb") as stream:
              dictionary = plistlib.load(stream)
          for command in optional:
              entry = dictionary.get(command)
              if not entry or entry[0] != f"{command}.framework/{command}":
                  raise SystemExit(f"Unexpected {command} command mapping")
              del dictionary[command]
              stub = Path("Resources_mini/bin") / command
              if not stub.exists() or stub.stat().st_size != 0:
                  raise SystemExit(f"Unexpected {command} command stub")
              stub.unlink()
          with dictionary_path.open("wb") as stream:
              plistlib.dump(dictionary, stream)

          # Free Apple ID signing cannot grant the upstream App Group. The
          # upstream optional path otherwise reaches setenv as NULL and crashes
          # during launch. Retain the shared path when available; use this app's
          # own Library directory for standalone sideloaded installs.
          delegate_path = Path("a-Shell/AppDelegate.swift")
          delegate = delegate_path.read_text(encoding="utf-8")
          group_lookup = (
              'FileManager().containerURL(forSecurityApplicationGroupIdentifier:'
              '"group.AsheKube.a-Shell")?.path'
          )
          if delegate.count(group_lookup) != 2:
              raise SystemExit("Official AppDelegate App Group setup changed")
          delegate = delegate.replace(group_lookup, f"({group_lookup} ?? libraryURL.path)")
          delegate_path.write_text(delegate, encoding="utf-8")
          print("Linked official Vapor package; excluded pico and multimarkdown; guarded App Group fallback")
          PY

      - name: Preflight Xcode project and Vapor linkage
        shell: bash
        run: |
          cd a-shell
          plutil -lint a-Shell.xcodeproj/project.pbxproj
          python3 - <<'PY'
          import re
          from pathlib import Path

          project = Path("a-Shell.xcodeproj/project.pbxproj").read_text()
          build = "A5E110000000000000000001"
          product = "A5E110000000000000000002"
          package = "2213DCC12BDFEF8F008BD5F2"
          phase = re.search(
              r"(?ms)^\s*224A904C2ADD0999006DB9CC /\* Frameworks \*/ = \{(.*?)^\s*\};",
              project,
          )
          target = re.search(
              r"(?ms)^\s*224A90352ADD0999006DB9CC /\* a-Shell-noPython \*/ = \{(.*?)^\s*\};",
              project,
          )
          if not phase or not target:
              raise SystemExit("Official noPython target or Frameworks phase missing")
          if f"{build} /* Vapor in Frameworks */" not in phase.group(1):
              raise SystemExit("Vapor absent from noPython Frameworks phase")
          if f"{product} /* Vapor */" not in target.group(1):
              raise SystemExit("Vapor absent from noPython package dependencies")
          if not re.search(
              rf"{build} /\* Vapor in Frameworks \*/ = \{{isa = PBXBuildFile; "
              rf"productRef = {product} /\* Vapor \*/; \}};", project,
          ):
              raise SystemExit("Vapor build file does not resolve to package product")
          if not re.search(
              rf"{product} /\* Vapor \*/ = \{{.*?package = {package} "
              r"/\* XCRemoteSwiftPackageReference \"vapor\" \*/;.*?productName = Vapor;",
              project, re.S,
          ):
              raise SystemExit("Vapor product does not resolve to official package")
          for source in ("a-Shell/AppDelegate.swift", "a-Shell/SceneDelegate.swift"):
              if "import Vapor" not in Path(source).read_text(encoding="utf-8"):
                  raise SystemExit(f"Expected official Vapor import missing in {source}")
          delegate = Path("a-Shell/AppDelegate.swift").read_text(encoding="utf-8")
          fallback = (
              '(FileManager().containerURL(forSecurityApplicationGroupIdentifier:'
              '"group.AsheKube.a-Shell")?.path ?? libraryURL.path)'
          )
          if delegate.count(fallback) != 2:
              raise SystemExit("Sideload-safe SHORTCUTS/GROUP path fallback missing")
          print("Official Vapor package linked; App Group startup fallback verified")
          PY
          xcodebuild -resolvePackageDependencies \
            -project a-Shell.xcodeproj \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/ashell-swift-packages"

      - name: Preflight noPython source and resource files
        shell: bash
        run: |
          cd a-shell
          python3 - <<'PY'
          import re
          from pathlib import Path

          project = Path("a-Shell.xcodeproj/project.pbxproj").read_text()
          objects = {}
          for line in project.splitlines():
              match = re.match(r"\s*([A-F0-9]{24}) /\*.*?\*/ = \{(.*)\};", line)
              if match:
                  objects[match.group(1)] = match.group(2)
          objects.update({
              match.group(1): match.group(2)
              for match in re.finditer(
                  r"(?ms)^\t\t([A-F0-9]{24}) /\*[^\n]*?\*/ = \{\n(.*?)^\t\t\};",
                  project,
              )
          })

          def value(body, key):
              match = re.search(rf'\b{key} = ("[^"]*"|[^;]*);', body)
              return match.group(1).strip('"') if match else None

          def ids(body, key):
              match = re.search(rf"\b{key} = \((.*?)\);", body, re.S)
              if not match:
                  return []
              return re.findall(r"([A-F0-9]{24}) /\*", match.group(1))

          parents = {}
          for object_id, body in objects.items():
              if value(body, "isa") in {"PBXGroup", "PBXVariantGroup"}:
                  for child in ids(body, "children"):
                      parents[child] = object_id

          def source_path(file_id):
              body = objects[file_id]
              parts = [value(body, "path") or value(body, "name")]
              if value(body, "sourceTree") == "SOURCE_ROOT":
                  return Path(parts[0])
              parent = parents.get(file_id)
              while parent:
                  group = objects[parent]
                  group_path = value(group, "path")
                  if group_path:
                      parts.insert(0, group_path)
                  if value(group, "sourceTree") == "SOURCE_ROOT":
                      break
                  parent = parents.get(parent)
              return Path(*[part for part in parts if part])

          def check_file(file_id):
              body = objects[file_id]
              if value(body, "isa") == "PBXVariantGroup":
                  return [check_file(child) for child in ids(body, "children")]
              location = source_path(file_id)
              if not location.exists():
                  raise SystemExit(f"Missing noPython source/resource: {location}")
              return str(location)

          target_ids = ["224A90352ADD0999006DB9CC"]
          checked = 0
          for target_id in target_ids:
              target = objects[target_id]
              for dependency_id in ids(target, "dependencies"):
                  dependency = objects[dependency_id]
                  child_target = value(dependency, "target")
                  if child_target:
                      target_ids.append(child_target.split()[0])
              for phase_id in ids(target, "buildPhases"):
                  phase = objects[phase_id]
                  if value(phase, "isa") not in {"PBXSourcesBuildPhase", "PBXResourcesBuildPhase"}:
                      continue
                  for build_id in ids(phase, "files"):
                      reference = value(objects[build_id], "fileRef")
                      if not reference:
                          raise SystemExit(f"Missing fileRef for {build_id}")
                      check_file(reference.split()[0])
                      checked += 1
          if not Path("a-Shell/Util/jsc.swift").exists():
              raise SystemExit("Official JavaScriptCore source jsc.swift is missing")
          print(f"Validated {checked} noPython and extension source/resource references")
          PY

      - name: Preflight official noPython dependencies
        shell: bash
        run: |
          cd a-shell
          python3 - <<'PY'
          import re
          from pathlib import Path
          from urllib.request import urlopen

          project = Path("a-Shell.xcodeproj/project.pbxproj").read_text()
          phase_ids = ("224A904C2ADD0999006DB9CC", "224A90682ADD0999006DB9CC")
          required = set()
          for phase_id in phase_ids:
              phase = re.search(
                  rf"(?ms)^\s*{phase_id} /\* (?:Frameworks|Embed Frameworks) \*/ = \{{(.*?)^\s*\}};",
                  project,
              )
              if not phase:
                  raise SystemExit(f"Missing official noPython build phase {phase_id}")
              required.update(re.findall(r"/\* (.+?) in (?:Frameworks|Embed Frameworks) \*/", phase.group(1)))
          # Vapor is checked and resolved in the Swift-package preflight above.
          if "Vapor" not in required:
              raise SystemExit("Vapor missing from noPython Frameworks phase")
          required.remove("Vapor")

          pattern = re.compile(
              r'\.binaryTarget\(\s*name:\s*"([^"]+)"\s*,\s*'
              r'url:\s*"([^"]+)"\s*,\s*checksum:\s*"([0-9a-f]+)"\s*\)',
              re.S,
          )
          pinned = {name for name, _, _ in pattern.findall(Path("xcfs/Package.swift").read_text())}
          current_url = (
              "https://raw.githubusercontent.com/holzschu/a-shell/"
              "350327e186dc471269d6f0f576d267cdbcc5d304/xcfs/Package.swift"
          )
          current = {name for name, _, _ in pattern.findall(urlopen(current_url).read().decode())}
          # libpng is published in the official Python-aux 1.0 release and
          # verified by SHA-256 in the download step below.
          covered = {f"{name}.xcframework" for name in pinned | current | {"libpng"}}
          unresolved = sorted(required - covered)
          print(f"Official noPython target: {len(required)} frameworks")
          print(f"Manifest or official release backed: {len(required) - len(unresolved)}")
          if unresolved:
              raise SystemExit("No verified official dependency for: " + ", ".join(unresolved))
          PY

      - name: Download documented xcFramework dependencies
        shell: bash
        run: |
          cd a-shell
          python3 - <<'PY'
          import hashlib
          import re
          import urllib.request
          import zipfile
          from pathlib import Path

          # Resolve only binary targets referenced by a-Shell-noPython's Frameworks
          # and Embed Frameworks phases.  The complete official package catalog
          # contains large TeX/LLVM/Perl frameworks that noPython does not embed.
          project = Path("a-Shell.xcodeproj/project.pbxproj").read_text()
          phase_ids = ("224A904C2ADD0999006DB9CC", "224A90682ADD0999006DB9CC")
          required_outputs = set()
          for phase_id in phase_ids:
              phase = re.search(
                  rf"\b{phase_id} /\*.*?\*/ = \{{(.*?)\n\s*\}};",
                  project,
                  re.S,
              )
              if not phase:
                  raise SystemExit(f"Missing a-Shell-noPython build phase {phase_id}")
              required_outputs.update(
                  name.removesuffix(".xcframework")
                  for name in re.findall(
                      r"/\* (.+?) in (?:Frameworks|Embed Frameworks) \*/",
                      phase.group(1),
                  )
              )

          manifest = Path("xcfs/Package.swift").read_text()
          pattern = re.compile(
              r'\.binaryTarget\(\s*name:\s*"([^"]+)"\s*,\s*'
              r'url:\s*"([^"]+)"\s*,\s*checksum:\s*"([0-9a-f]+)"\s*\)',
              re.S,
          )
          pinned_targets = {
              name: (url, checksum)
              for name, url, checksum in pattern.findall(manifest)
          }

          # Some GitHub release assets were replaced in place after this source
          # revision.  Use checksum corrections only where the current pinned
          # official manifest names the exact same URL.
          metadata_url = (
              "https://raw.githubusercontent.com/holzschu/a-shell/"
              "350327e186dc471269d6f0f576d267cdbcc5d304/xcfs/Package.swift"
          )
          current_manifest = urllib.request.urlopen(metadata_url).read().decode()
          current_targets = {
              name: (url, checksum)
              for name, url, checksum in pattern.findall(current_manifest)
          }

          artifacts = Path("xcfs/.build/artifacts/xcfs")
          downloads = Path("xcfs/.build/downloads")
          artifacts.mkdir(parents=True, exist_ok=True)
          downloads.mkdir(parents=True, exist_ok=True)
          targets = []
          for name in sorted(required_outputs & (pinned_targets.keys() | current_targets.keys())):
              if name in pinned_targets:
                  url, expected = pinned_targets[name]
                  current = current_targets.get(name)
                  if current and current[0] == url:
                      expected = current[1]
              else:
                  # Two mini inputs (ssh_cmdA and ssh_agent) were added to the
                  # official catalog after the pinned project revision.
                  url, expected = current_targets[name]
              if name == "ios_system":
                  if not url.endswith("/v3.0.2/ios_system.xcframework.zip"):
                      raise SystemExit("Unexpected pinned ios_system dependency")
                  # The official v3.0.3 release adds the two WebAssembly APIs
                  # called by this upstream noPython source revision. Keep
                  # every other archive at its previously verified version.
                  url = (
                      "https://github.com/holzschu/ios_system/releases/"
                      "download/v3.0.3/ios_system.xcframework.zip"
                  )
                  expected = "50f1692873e73fd862f45f73f2c08745e822c01ff5e0a0e0aec7fed6bb946e7f"
              targets.append((name, url, expected))
          if not targets:
              raise SystemExit("No a-Shell-noPython binary targets found")
          print(f"a-Shell-noPython requires {len(targets)} official binary archives")

          for name, url, expected in targets:
              archive = downloads / f"{name}.zip"
              print(f"Downloading {name}", flush=True)
              urllib.request.urlretrieve(url, archive)
              digest = hashlib.sha256()
              with archive.open("rb") as payload:
                  for chunk in iter(lambda: payload.read(1024 * 1024), b""):
                      digest.update(chunk)
              actual = digest.hexdigest()
              if actual != expected:
                  raise SystemExit(
                      f"Checksum mismatch for {name}: expected {expected}, got {actual}"
                  )
              with zipfile.ZipFile(archive) as bundle:
                  bundle.extractall(artifacts)

          # SwiftPM stores these two targets one level below the other binary
          # artifacts. Reproduce that documented artifact layout without asking
          # SwiftPM to resolve the unused catalog.
          for nested in ("libssh2", "openssl"):
              source = artifacts / f"{nested}.xcframework"
              destination = artifacts / nested / source.name
              destination.parent.mkdir(exist_ok=True)
              if source.exists() and not destination.exists():
                  source.rename(destination)
          PY

          # The Xcode project references these two official manifest artifacts
          # through cpython/Python-aux rather than xcfs' artifact directory.
          mkdir -p cpython/Python-aux "$RUNNER_TEMP/python-aux"
          cp -R xcfs/.build/artifacts/xcfs/freetype.xcframework cpython/Python-aux/
          cp -R xcfs/.build/artifacts/xcfs/harfbuzz.xcframework cpython/Python-aux/

          # libpng is an explicit a-Shell-noPython Xcode input published by the same
          # official Python-aux release, but is not part of a-Shell's xcfs catalog.
          curl -fsSL -o "$RUNNER_TEMP/python-aux/libpng.zip" \
            https://github.com/holzschu/Python-aux/releases/download/1.0/libpng.xcframework.zip
          echo "30ff80e9a2c20d7f266e7f788e94e44b2e105ac9c8107b44eb91f6869d6d8aa4  $RUNNER_TEMP/python-aux/libpng.zip" | shasum -a 256 -c -
          unzip -q -o "$RUNNER_TEMP/python-aux/libpng.zip" -d cpython/Python-aux

          test -d cpython/Python-aux/freetype.xcframework
          test -d cpython/Python-aux/harfbuzz.xcframework
          test -d cpython/Python-aux/libpng.xcframework

      - name: Preflight Xcode framework paths
        shell: bash
        run: |
          cd a-shell
          python3 - <<'PY'
          import plistlib
          import re
          from pathlib import Path

          project = Path("a-Shell.xcodeproj/project.pbxproj").read_text()
          phase = re.search(
              r"(?ms)^\s*224A90682ADD0999006DB9CC /\* Embed Frameworks \*/ = \{(.*?)^\s*\};",
              project,
          )
          if not phase:
              raise SystemExit("Missing official noPython embed phase")
          missing = []
          for build_id in re.findall(r"([A-F0-9]{24}) /\* .+? in Embed Frameworks \*/", phase.group(1)):
              build = re.search(rf"(?m)^\s*{build_id} /\*.*?\*/ = .*?fileRef = ([A-F0-9]{{24}})", project)
              if not build:
                  raise SystemExit(f"Missing PBXBuildFile {build_id}")
              file_ref = re.search(rf"(?m)^\s*{build.group(1)} /\*.*?\*/ = .*?path = (\"[^\"]+\"|[^;]+);", project)
              if not file_ref:
                  raise SystemExit(f"Missing PBXFileReference {build.group(1)}")
              path = Path(file_ref.group(1).strip('"'))
              if not path.exists():
                  missing.append(str(path))
              elif path.suffix == ".xcframework":
                  with (path / "Info.plist").open("rb") as stream:
                      metadata = plistlib.load(stream)
                  device_slice = any(
                      library.get("SupportedPlatform") == "ios"
                      and not library.get("SupportedPlatformVariant")
                      and "arm64" in library.get("SupportedArchitectures", [])
                      for library in metadata.get("AvailableLibraries", [])
                  )
                  if not device_slice:
                      raise SystemExit(f"No iOS arm64 device slice in {path}")
          if missing:
              raise SystemExit("Missing required framework paths:\n" + "\n".join(sorted(missing)))
          print("All official noPython embedded frameworks have iOS arm64 device slices")
          PY

      - name: Preflight ios_system WebAssembly ABI and Swift import
        shell: bash
        run: |
          cd a-shell
          python3 - <<'PY'
          import plistlib
          import re
          import subprocess
          from pathlib import Path

          framework = Path("xcfs/.build/artifacts/xcfs/ios_system.xcframework")
          with (framework / "Info.plist").open("rb") as stream:
              metadata = plistlib.load(stream)
          device = [
              library for library in metadata.get("AvailableLibraries", [])
              if library.get("SupportedPlatform") == "ios"
              and not library.get("SupportedPlatformVariant")
              and "arm64" in library.get("SupportedArchitectures", [])
          ]
          if len(device) != 1:
              raise SystemExit("Expected one iOS arm64 ios_system device slice")
          library = device[0]
          bundle = framework / library["LibraryIdentifier"] / library["LibraryPath"]
          binary = bundle / "ios_system"
          header = bundle / "Headers/ios_system.h"
          module_map = bundle / "Modules/module.modulemap"
          if not all(path.is_file() for path in (binary, header, module_map)):
              raise SystemExit("ios_system binary, public header, or module map missing")
          declarations = {
              "finishedPreparingWebAssemblyCommand":
                  r"extern\s+void\s+finishedPreparingWebAssemblyCommand\s*\(void\)\s*;",
              "webAssemblyCommandOrder":
                  r"extern\s+int\s+webAssemblyCommandOrder\s*\(void\)\s*;",
          }
          contents = header.read_text(encoding="utf-8")
          for name, pattern in declarations.items():
              if not re.search(pattern, contents):
                  raise SystemExit(f"Public ios_system header lacks {name}")
          if 'framework module ios_system' not in module_map.read_text(encoding="utf-8"):
              raise SystemExit("ios_system Swift/Clang module map missing")
          architectures = subprocess.check_output(
              ["xcrun", "lipo", "-archs", str(binary)], text=True,
          ).split()
          if "arm64" not in architectures:
              raise SystemExit("ios_system binary lacks arm64 architecture")
          symbols = subprocess.check_output(
              ["xcrun", "nm", "-gU", str(binary)], text=True,
          )
          for name in declarations:
              if not re.search(rf"(?m)\b[Tt]\s+_{name}$", symbols):
                  raise SystemExit(f"ios_system arm64 binary does not export {name}")
          print("Official ios_system v3.0.3 exports both WebAssembly APIs on iOS arm64")
          PY
          cat > "$RUNNER_TEMP/check-ios-system.swift" <<'SWIFT'
          import ios_system
          func checkWebAssemblyAPI() {
              finishedPreparingWebAssemblyCommand()
              _ = webAssemblyCommandOrder()
          }
          SWIFT
          xcrun --sdk iphoneos swiftc -typecheck \
            -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -target arm64-apple-ios14.0 \
            -F xcfs/.build/artifacts/xcfs/ios_system.xcframework/ios-arm64 \
            "$RUNNER_TEMP/check-ios-system.swift"

      - name: Build verified a-Shell-noPython target without signing
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ashell-products"
          xcodebuild \
            -project a-shell/a-Shell.xcodeproj \
            -target a-Shell-noPython \
            -configuration Release \
            -sdk iphoneos \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/ashell-swift-packages" \
            SYMROOT="$RUNNER_TEMP/ashell-products" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        shell: bash
        run: |
          APP=$(find "$RUNNER_TEMP/ashell-products" -type d -name 'a-Shell-noPython.app' -print -quit)
          test -n "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$APP" "$RUNNER_TEMP/ipa/Payload/a-Shell-noPython.app"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/a-Shell-noPython-unsigned.ipa" Payload

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: a-Shell-noPython-official-unsigned
          path: a-Shell-noPython-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
